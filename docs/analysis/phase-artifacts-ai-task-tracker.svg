ont-family="Segoe UI">- glossary.md: business and harness terminology</text></g><!--entity A02--><g class="entity" data-qualified-name="A02" id="ent0003" data-source-line="10"><rect x="91" y="255" width="610.823" height="79.854" fill="#90EE90" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="101" y="281.187" fill="#000" font-size="15" textLength="278.013" font-family="Segoe UI">A-02 E2E use cases and data - T-003 done</text><text x="101" y="301.138" fill="#000" font-size="15" textLength="590.823" font-family="Segoe UI">- e2e-use-cases-*.md: 8 end-to-end use cases with main/alternative flows and traceability</text><text x="101" y="321.089" fill="#000" font-size="15" textLength="441.921" font-family="Segoe UI">- e2e-test-data-*.yaml: harness-e2e/1, fixtures and expected values</text></g><!--entity U01--><g class="entity" data-qualified-name="U01" id="ent0004" data-source-line="11"><rect x="132.5" y="359" width="528.411" height="79.854" fill="#90EE90" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="142.5" y="385.187" fill="#000" font-size="15" textLength="266.785" font-family="Segoe UI">U-01 UX flows and screens - T-004 done</text><text x="142.5" y="405.138" fill="#000" font-size="15" textLength="477.964" font-family="Segoe UI">- user-flows-*.md: 2 personas, flows F-1..F-8 and broken flows BF-1/BF-2</text><text x="142.5" y="425.089" fill="#000" font-size="15" textLength="508.411" font-family="Segoe UI">- screens-*.md: S-01..S-06 with states, accessibility notes and Russian UI copy</text></g><!--entity U02--><g class="entity" data-qualified-name="U02" id="ent0005" data-source-line="12"><rect x="79" y="463" width="635.483" height="99.805" fill="#90EE90" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="89" y="489.187" fill="#000" font-size="15" textLength="331.135" font-family="Segoe UI">U-02 Wireframes, prototype, UI spec - T-005 done</text><text x="89" y="509.138" fill="#000" font-size="15" textLength="615.483" font-family="Segoe UI">- wireframes-*.puml/.svg: Salt wireframes for S-01..S-06, including empty/loading/error states</text><text x="89" y="529.089" fill="#000" font-size="15" textLength="518.774" font-family="Segoe UI">- ui-spec-*.md: 9 sections, design tokens, component behavior and traceability</text><text x="89" y="549.04" fill="#000" font-size="15" textLength="510.139" font-family="Segoe UI">- prototype: index page, 8 use-case pages and offline assets for UX validation</text></g><!--entity R01--><g class="entity" data-qualified-name="R01" id="ent0006" data-source-line="13"><rect x="7" y="587" width="778.562" height="119.756" fill="#90EE90" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="613.187" fill="#000" font-size="15" textLength="322.31" font-family="Segoe UI">R-01 Solution design and contracts - T-006 done</text><text x="17" y="633.138" fill="#000" font-size="15" textLength="572.666" font-family="Segoe UI">- ADR-0001: modular monolith with PostgreSQL 16 + pgvector, Redis and local Ollama</text><text x="17" y="653.089" fill="#000" font-size="15" textLength="758.562" font-family="Segoe UI">- architecture-*.md: 11 sections covering context, components, data, scenarios SCN-001..008 and APIs API-001..004</text><text x="17" y="673.04" fill="#000" font-size="15" textLength="717.283" font-family="Segoe UI">- contracts-*.md: 8 sections covering data model, ingestion pipeline, REST endpoints, errors and e2e strategy</text><text x="17" y="692.991" fill="#000" font-size="15" textLength="314.619" font-family="Segoe UI">- 4 OpenAPI 3.x specifications: API-001..API-004</text></g><!--entity R02--><g class="entity" data-qualified-name="R02" id="ent0007" data-source-line="14"><rect x="185" y="731" width="423.359" height="79.854" fill="#90EE90" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="195" y="757.187" fill="#000" font-size="15" textLength="273.186" font-family="Segoe UI">R-02 Diagrams and handoff - T-007 done</text><text x="195" y="777.138" fill="#000" font-size="15" textLength="403.359" font-family="Segoe UI">- component, data-model and class diagrams: .puml and .svg</text><text x="195" y="797.089" fill="#000" font-size="15" textLength="346.992" font-family="Segoe UI">- 8 sequence diagrams SCN-001..008: .puml and .svg</text></g><!--entity I01--><g class="entity" data-qualified-name="I01" id="ent0008" data-source-line="15"><rect x="131.5" y="835" width="530.454" height="139.707" fill="#FFE082" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="141.5" y="861.187" fill="#000" font-size="15" textLength="329.465" font-family="Segoe UI">I-01 Implementation and tests - T-008 in progress</text><text x="141.5" y="881.138" fill="#000" font-size="15" textLength="510.454" font-family="Segoe UI">- backend: 73 Java files across config, domain, ingestion, REST API and search</text><text x="141.5" y="901.089" fill="#000" font-size="15" textLength="451.934" font-family="Segoe UI">- Flyway migrations V1..V3, application.yml and environment profiles</text><text x="141.5" y="921.04" fill="#000" font-size="15" textLength="423.64" font-family="Segoe UI">- 20 test classes, 129 @Test methods, including integration tests</text><text x="141.5" y="940.991" fill="#000" font-size="15" textLength="488.774" font-family="Segoe UI">- Dockerfile, docker-compose.yml, Makefile and .env.example for local run</text><text x="141.5" y="960.942" fill="#000" font-size="15" textLength="202.229" font-family="Segoe UI">- Vue 3 SPA C6a..C6d: pending</text></g><!--entity I02--><g class="entity" data-qualified-name="I02" id="ent0009" data-source-line="16"><rect x="204.5" y="999" width="383.655" height="79.854" fill="#D3D3D3" style="stroke:#181818;stroke-width:0.5;" rx="3" ry="3"/><text x="214.5" y="1025.187" fill="#000" font-size="15" textLength="245.559" font-family="Segoe UI">I-02 E2E automation - T-009 pending</text><text x="214.5" y="1045.138" fill="#000" font-size="15" textLength="363.655" font-family="Segoe UI">- tests/e2e/*