services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-task-tracker-backend:latest
    container_name: aitasktracker-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/aitasktracker"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-aitasktracker}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-aitasktracker}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENCODE_DATA_DIR: /data/opencode
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-60}
      SEARCH_TOP_K: ${SEARCH_TOP_K:-5}
    volumes:
      # Host opencode data bind-mounted READ-ONLY; never written back.
      # Default path avoids a leading dash so Compose parses it as a host path.
      - ${OPENCODE_DATA_DIR:-./data/opencode}:/data/opencode:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aitasktracker-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitasktracker-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: aitasktracker
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-aitasktracker}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-aitasktracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-aitasktracker} -d aitasktracker"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aitasktracker-net

  redis:
    image: redis:7-alpine
    container_name: aitasktracker-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aitasktracker-net

  frontend:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    image: ai-task-tracker-frontend:latest
    container_name: aitasktracker-frontend
    # Served on http://127.0.0.1:8081 from the browser (nginx listens on :80).
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    networks:
      - aitasktracker-net

volumes:
  postgres-data:

networks:
  aitasktracker-net:
    driver: bridge
