server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aitrack}}
    username: ${POSTGRES_USER:aitrack}
    password: ${POSTGRES_PASSWORD:aitrack}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    encoding: UTF-8
    property-naming-strategy: SNAKE_CASE

tracker:
  opencode:
    data-dir: ${OPENCODE_DATA_DIR:./data/opencode}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  ingest-interval-seconds: ${INGEST_INTERVAL_SECONDS:60}
  search-top-k: ${SEARCH_TOP_K:5}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    ru.aitasktracker: INFO
