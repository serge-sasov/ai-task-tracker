# SPA served statically, with the backend API proxied from the same origin.
# The /api/* requests are forwarded to the compose "backend" service.
upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (history, etc.) may be larger than the nginx default 1m.
    client_max_body_size 50m;

    # Gzip the static assets for faster first paint.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # SPA history fallback: any non-API route that does not resolve to a
    # real file falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy the API to the backend service on the compose network.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve chunked streaming for long-running search responses.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
